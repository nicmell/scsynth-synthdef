# The core class library of SuperCollider 3.14.1 and the folder SC3plugins
# of the Extensions, without the other extensions and without quarks:
# `sclang -l "$PWD/generator/sc3_plugins/sclang_conf.yaml" <script>`.
includePaths:
    -   /Applications/SuperCollider.app/Contents/Resources/SCClassLibrary
    -   /Users/nick/Library/Application Support/SuperCollider/Extensions/SC3plugins
excludePaths:
    []
postInlineWarnings: false
excludeDefaultPaths: true
